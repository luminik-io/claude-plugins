name: Verify marketplaces

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out marketplace and pinned plugins
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - name: Verify Claude and Codex marketplace alignment
        run: |
          python3 scripts/verify_marketplaces.py
          python3 -m unittest discover -s tests

      - name: Check JSON formatting
        run: |
          python3 -m json.tool .claude-plugin/marketplace.json >/dev/null
          python3 -m json.tool .agents/plugins/marketplace.json >/dev/null
          python3 -m json.tool plugins/event-outbound/.claude-plugin/plugin.json >/dev/null
          python3 -m json.tool plugins/event-outbound/.codex-plugin/plugin.json >/dev/null
